# =============================================================================
# Level 1: Interactive Claude — Responds to @claude mentions
# =============================================================================
# This is the "default" workflow. Install it and @claude just works.
#
# What it does:
#   - Responds to @claude in issue comments, PR comments, and PR reviews
#   - Auto-triggers on new issues mentioning @claude
#   - Uses your repo's CLAUDE.md for context
#
# Setup:
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Add ANTHROPIC_API_KEY to repo Settings > Secrets > Actions
#   3. Copy this file to .github/workflows/claude.yml
#   4. Test: comment "@claude hello" on any issue
# =============================================================================

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

jobs:
  claude:
    # Only run when @claude is mentioned (or issue assignment/label triggers)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (
        github.event.action == 'labeled' && github.event.label.name == 'claude' ||
        github.event.action == 'assigned' && github.event.assignee.login == 'claude[bot]' ||
        github.event.action == 'opened' && contains(github.event.issue.body, '@claude')
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Read/write files, create branches
      pull-requests: write   # Comment on PRs, create PRs
      issues: write          # Comment on issues
      id-token: write        # OIDC token (for Bedrock/Vertex if used)
      actions: read          # Read CI logs (for debugging failures)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # trigger_phrase: "@claude"       # default
          # assignee_trigger: "claude[bot]" # uncomment to enable
          # label_trigger: "claude"         # uncomment to enable

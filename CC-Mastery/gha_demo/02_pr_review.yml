# =============================================================================
# Level 2: Automatic PR Review — Claude reviews every PR on open/update
# =============================================================================
# This is the first "automation mode" workflow (has a `prompt` input).
#
# Key difference from Level 1:
#   - Level 1 = interactive (waits for @claude mention)
#   - Level 2 = automation (runs immediately on PR events)
#
# What it does:
#   - Triggers on every PR opened or updated
#   - Reviews for code quality, bugs, security, performance
#   - Posts inline comments on specific lines
#   - Posts a summary comment on the PR
#
# Tool safety:
#   - Only read tools + comment tools allowed (no Write/Edit)
#   - Claude cannot modify code, only review it
# =============================================================================

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    # Skip draft PRs and bot PRs
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review PR with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            AUTHOR: ${{ github.event.pull_request.user.login }}

            Review this PR focusing on:
            1. **Correctness** — Logic bugs, edge cases, off-by-one errors
            2. **Security** — Injection, auth issues, secret exposure
            3. **Performance** — N+1 queries, unnecessary allocations, blocking calls
            4. **Maintainability** — Naming, abstractions, test coverage

            Guidelines:
            - Use inline comments for specific code issues (with file:line references)
            - Use a top-level PR comment for overall summary
            - Be constructive — suggest fixes, not just problems
            - Don't nitpick style if a linter/formatter handles it
            - If the PR looks good, say so briefly — don't manufacture issues

          claude_args: |
            --max-turns 10
            --model claude-sonnet-4-6
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

          use_sticky_comment: true  # One comment, updated on re-review
